name: Phase 03 analysis and prompts

on:
  push:
    branches: ["dev/v1-phase-03-prompts"]
  pull_request:

jobs:
  phase-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create and verify canonical environment
        run: python scripts/setup_env.py
      - name: Run Python tests on Linux
        if: runner.os == 'Linux'
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Run Python tests on Windows
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Run workstation tests
        working-directory: frontend
        run: npm test
      - name: Build workstation
        working-directory: frontend
        run: npm run build
