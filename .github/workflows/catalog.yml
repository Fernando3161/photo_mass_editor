name: Phase 01 catalog

on:
  push:
    branches: ["dev/v1-phase-01-catalog"]
  pull_request:

jobs:
  catalog-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create and verify canonical environment
        run: python scripts/setup_env.py
      - name: Run synthetic catalog tests on Linux
        if: runner.os == 'Linux'
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Run synthetic catalog tests on Windows
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m unittest discover -s tests -v
