name: Photo Mass Editor checks

on:
  push:
    branches: ["main", "dev/v1-phase-07-release-cleanup", "dev/v2-02-batch-workflow", "dev/v2-03-intelligence-prompts", "dev/v2-04-provenance-launch"]
  pull_request:

jobs:
  phase-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create and verify canonical environment
        run: python scripts/setup_env.py
      - name: Run Python tests on Linux
        if: runner.os == 'Linux'
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Run Python tests on Windows
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Run workstation tests
        working-directory: frontend
        run: npm test
      - name: Build workstation
        working-directory: frontend
        run: npm run build
      - name: Verify Linux launcher and offline restart
        if: runner.os == 'Linux'
        env:
          PIP_NO_INDEX: '1'
        run: |
          bash -n scripts/start.sh
          bash scripts/start.sh --check
          .venv/bin/python scripts/frontend_bundle.py
      - name: Verify Windows launcher and offline restart
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PIP_NO_INDEX: '1'
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/start.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw "PowerShell syntax errors: $errors" }
          & ./scripts/start.ps1 -Check -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher check failed' }
          & ./.venv/Scripts/python.exe scripts/frontend_bundle.py
